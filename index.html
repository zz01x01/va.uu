<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无畏契约组队预约</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #fff5f8;
            color: #442c38;
            padding: 30px 16px;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
            background: #ffffff;
            padding: 32px 26px;
            border-radius: 22px;
            box-shadow: 0 4px 14px #ffd6e377;
            border: 1px solid #ffd6e3;
        }
        h1 {
            text-align: center;
            color: #f278a1;
            margin-bottom: 28px;
            font-size: 24px;
            font-weight: 600;
        }
        .form-item {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #6b3f50;
        }
        .req {
            color: #f278a1;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid #ffd6e3;
            background: #fff9fb;
            color: #442c38;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #f278a1;
            box-shadow: 0 0 0 3px #ffd6e370;
        }
        textarea {
            resize: vertical;
            min-height: 95px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #f278a1;
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #e8648f;
        }
        #result {
            margin-top: 22px;
            padding: 18px;
            border: 1px solid #b9e6c8;
            border-radius: 16px;
            background: #f6fff9;
            display: none;
        }
        #result h3 {
            color: #349c5c;
            margin-bottom: 10px;
            font-size: 17px;
        }
        #resText {
            white-space: pre-line;
            line-height: 1.7;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>预约小帅哥的瓦ovo </h1>
        <form action="https://formsubmit.co/aa19b1f1b214426062d5965861e86a91" method="POST" id="bookForm">
            <input type="hidden" name="_subject" value="新的瓦罗兰特组队预约！">
            <input type="hidden" name="_captcha" value="false">

            <div class="form-item">
                <label>游戏ID <span class="req">*</span></label>
                <input type="text" name="游戏ID" required>
            </div>
            <div class="form-item">
                <label>段位 <span class="req">*</span></label>
                <select name="段位" required>
                    <option value="">请选择段位</option>
                    <option>黑铁</option>
                    <option>青铜</option>
                    <option>白银</option>
                    <option>黄金</option>
                    <option>铂金</option>
                    <option>钻石</option>
                    <option>超凡入圣</option>
                    <option>神话</option>
                    <option>辐能战魂</option>
                </select>
            </div>
            <div class="form-item">
                <label>预约日期 <span class="req">*</span></label>
                <input type="date" name="预约日期" required>
            </div>
            <div class="form-item">
                <label>预约时间 <span class="req">*</span></label>
                <input type="time" name="预约时间" required>
            </div>
            <div class="form-item">
                <label>游戏模式 <span class="req">*</span></label>
                <select name="游戏模式" required>
                    <option value="">选择模式</option>
                    <option>排位赛</option>
                    <option>普通匹配</option>
                    <option>极速模式</option>
                </select>
            </div>
            <div class="form-item">
                <label>备注</label>
                <textarea name="备注" placeholder="想玩什么英雄、几排等，选填~"></textarea>
            </div>

            <button type="submit">提交预约</button>
        </form>

        <div id="result">
            <h3>✅ 预约提交成功！信息如下</h3>
            <p id="resText"></p >
        </div>
    </div>

    <script>
        const form = document.getElementById('bookForm');
        const resultBox = document.getElementById('result');
        const resultText = document.getElementById('resText');

        form.addEventListener('submit', function(e){
            e.preventDefault();
            const fd = new FormData(form);
            let info = "";
            for(let [k,v] of fd.entries()){
                info += k + "：" + v + "\n";
            }
            resultText.innerText = info;
            resultBox.style.display = "block";
            setTimeout(()=>{
                form.submit();
            }, 800);
        })
    </script>
</body>
</html>
