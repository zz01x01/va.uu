<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无畏契约小帅哥组队预约ovo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #fff5f8;
            color: #442c38;
            padding: 30px 16px;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
            background: #ffffff;
            padding: 32px 26px;
            border-radius: 22px;
            box-shadow: 0 4px 14px #ffd6e377;
            border: 1px solid #ffd6e3;
        }
        h1 {
            text-align: center;
            color: #f278a1;
            margin-bottom: 28px;
            font-size: 24px;
            font-weight: 600;
        }
        .form-item {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #6b3f50;
        }
        .req {
            color: #f278a1;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid #ffd6e3;
            background: #fff9fb;
            color: #442c38;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        /* 单独让date、time输入框文字靠左对齐，和别的输入框统一 */
        input[type="date"],
        input[type="time"] {
            text-align: left;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #f278a1;
            box-shadow: 0 0 0 3px #ffd6e370;
        }
        textarea {
            resize: vertical;
            min-height: 95px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #f278a1;
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #e8648f;
        }
        #result {
            margin-top: 22px;
            padding: 18px;
            border: 1px solid #b9e6c8;
            border-radius: 16px;
            background: #f6fff9;
            display: none;
        }
        #result h3 {
            color: #349c5c;
            margin-bottom: 10px;
            font-size: 17px;
        }
        #error {
            margin-top:22px;
            padding:18px;
            border:1px solid #ffb8b8;
            border-radius:16px;
            background:#fff3f3;
            color:#c94444;
            display:none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>小帅哥的组队预约~</h1>
        <form id="bookForm" action="https://formsubmit.co/aa19b1f1b214426062d5965861e86a91" method="POST" target="_blank">
            <input type="hidden" name="_subject" value="新的瓦罗兰特组队预约！">
            <div class="form-item">
                <label>游戏ID <span class="req">*</span></label>
                <input type="text" name="gameid" required placeholder="例：大帅哥#66666">
            </div>
            <div class="form-item">
                <label>段位 <span class="req">*</span></label>
                <select name="段位" required>
                    <option value="">请选择段位</option>
                    <option>黑铁/青铜/白银</option>
                    <option>黄金/铂金/钻石</option>
                    <option>超凡</option>
                    <option>神话</option>
                    <option>赋能</option>
                </select>
            </div>
            <div class="form-item">
                <label>预约日期 <span class="req">*</span></label>
                <input type="date" name="预约日期" required>
            </div>
            <div class="form-item">
                <label>预约时间 <span class="req">*</span></label>
                <input type="time" name="预约时间" required>
            </div>
            <div class="form-item">
                <label>游戏模式 <span class="req">*</span></label>
                <select name="游戏模式" required>
                    <option value="">选择模式</option>
                    <option>排位赛</option>
                    <option>普通匹配</option>
                    <option>极速模式</option>
                    <option>其他</option>
                </select>
            </div>
            <div class="form-item">
                <label>备注</label>
                <textarea name="备注" placeholder="有什么想对小帅哥说的~"></textarea>
            </div>

            <button type="submit" id="submitBtn">提交预约</button>
        </form>

        <div id="result">
            <h3>✅ 预约提交成功！</h3>
            <p>你的预约消息已经发送给主播啦~</p >
        </div>
        <div id="error">
            <h3>❌ 提交失败</h3>
            <p>网络异常，请稍后重试！</p >
        </div>
    </div>

    <script>
        const form = document.getElementById('bookForm');
        const resultBox = document.getElementById('result');

        form.addEventListener('submit', function(){
            setTimeout(()=>{
                resultBox.style.display = "block";
                form.reset();
            }, 600)
        })
    </script>
</body>
</html>
